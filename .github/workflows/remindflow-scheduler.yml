name: RemindFlow AI Cloud Reminder Scheduler ($0/month)

on:
  schedule:
    # Runs every 5 minutes in the cloud (24/7, even when your laptop is turned off)
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  trigger-scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger RemindFlow AI Cloud Scheduler Tick (with Free-Tier Wakeup Retry)
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL secret is not configured yet in GitHub Repository Secrets. Skipping."
            exit 0
          fi
          TARGET_URL="${APP_URL%/}/api/scheduler/tick"
          echo "Triggering scheduler at: $TARGET_URL"
          # Retry up to 3 times with 10s delay to gracefully wake sleeping free-tier instances
          curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 60 \
            -X POST "$TARGET_URL" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json"
